<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arqhive 시안 C 진열장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px;background:#F6F3EE;font-family:'Noto Sans KR',sans-serif}
.note{max-width:680px;margin:0 auto 12px;font-size:13px;color:#6B6052;line-height:1.7}
button{font-family:inherit;font-size:13px;padding:6px 12px;border:0.5px solid #8A7A63;border-radius:4px;cursor:pointer;background:transparent;color:#2A241D}
.f{position:relative;max-width:680px;margin:0 auto;background:#EFE9DF;color:#2A241D;border:0.5px solid #CDBFAA;border-radius:12px;overflow:hidden}
.chip{font-size:12px;padding:3px 10px;border-radius:2px}
.chip.on{background:#2A241D;color:#EFE9DF;border-color:#2A241D}
.shelf{display:flex;align-items:flex-end;gap:4px;padding:0 20px;flex-wrap:nowrap;overflow-x:auto}
.board{height:12px;background:#8A6A4A;margin:0 12px}
.sp{writing-mode:vertical-rl;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;padding:0 0 10px;cursor:pointer;transition:transform .2s,opacity .25s;border:0.5px solid rgba(0,0,0,.28);border-radius:2px;flex-shrink:0;user-select:none;width:40px;letter-spacing:1px}
.sp:hover{transform:translateY(-10px)}
.sp b{writing-mode:horizontal-tb;font-size:10px;font-weight:500;width:100%;text-align:center;padding:5px 0;letter-spacing:0}
.dim{opacity:.22}
.face{width:112px;height:150px;border-radius:3px;border:0.5px solid rgba(0,0,0,.28);padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .2s;flex-shrink:0}
.face:hover{transform:translateY(-6px)}
.ov{position:absolute;inset:0;background:rgba(32,26,20,.62);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.show{opacity:1;pointer-events:auto}
.stage{position:relative;width:460px;height:290px;perspective:1400px;transition:transform .8s cubic-bezier(.3,.7,.3,1);transform:translateX(-115px) scale(.85)}
.ov.open .stage{transform:translateX(0) scale(1)}
.tray{position:absolute;left:230px;top:0;width:230px;height:290px;background:#3A3530;border-radius:0 4px 4px 0;display:flex;align-items:center;justify-content:center}
.cov{position:absolute;left:230px;top:0;width:230px;height:290px;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.3,1) .15s}
.ov.open .cov{transform:rotateY(-180deg)}
.fc,.bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:0 4px 4px 0;box-sizing:border-box}
.bk{transform:rotateY(180deg);background:#FBF8F1;border-radius:4px 0 0 4px;padding:18px;border:0.5px solid #CDBFAA}
.disc{border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform 1.4s ease-out .5s}
.ov.open .disc{transform:rotate(220deg)}
</style>
</head>
<body>
<p class="note">arqhive 디자인 시안 C(진열장, 수정판) · 2026-10-03 확정한 "방향"을 보여 주는 참고용입니다. 실제 구현은 이 느낌만 가져갑니다. 속지 문구는 자리 채움용 예시입니다.</p>
<div class="f" id="root">
<div style="font-size:11px;color:#7A6A55;padding:6px 14px;border-bottom:0.5px solid #CDBFAA;font-family:monospace">arqhive.vercel.app</div>
<div style="padding:16px 22px 10px;display:flex;justify-content:space-between;align-items:baseline">
<div><span style="font-size:28px;font-weight:500">arqhive</span><span style="font-size:13px;color:#7A6A55;margin-left:12px">한글 패치 진열장</span></div>
<div style="font-size:12px;color:#7A6A55">진열장 보기 · <span style="text-decoration:underline">목록 보기</span></div>
</div>
<div id="chips" style="display:flex;gap:6px;flex-wrap:wrap;padding:0 22px 14px"></div>
<div style="font-size:11px;color:#7A6A55;padding:0 22px 6px">새로 들어온 패치</div>
<div class="shelf" id="faces" style="gap:14px"></div><div class="board"></div>
<div style="font-size:11px;color:#7A6A55;padding:16px 22px 6px">전체 진열</div>
<div class="shelf" id="s1"></div><div class="board"></div>
<div class="shelf" id="s2" style="margin-top:14px"></div><div class="board" style="margin-bottom:22px"></div>
<div class="ov" id="ov">
<div class="stage"><div class="tray" id="tray"></div>
<div class="cov"><div class="fc" id="fc"></div><div class="bk" id="bk"></div></div></div>
<button id="close" style="position:absolute;top:12px;right:14px;font-size:12px;background:#EFE9DF">닫기 ✕</button>
</div>
</div>
<script>
const P={GC:{bg:'#26252A',fg:'#F2F0EC',tag:'#4A4852',h:200,m:'disc',d:110,dc:'#C9C6BF'},
Wii:{bg:'#FAFAF8',fg:'#202020',tag:'#D9D9D6',h:210,m:'disc',d:150,dc:'#E4E2DC'},
'Wii U':{bg:'#EAF2F7',fg:'#173A4E',tag:'#B8D3E3',h:210,m:'disc',d:150,dc:'#D8E3EA'},
'3DS':{bg:'#FAF8F5',fg:'#202020',tag:'#E3B9B4',h:170,m:'cart',cw:70,ch:80,cc:'#5A5A5E'},
NDS:{bg:'#F4F3EF',fg:'#202020',tag:'#CFCFCB',h:170,m:'cart',cw:70,ch:74,cc:'#6A6A6E'},
SFC:{bg:'#DCCDB0',fg:'#2E2418',tag:'#BFAE8C',h:180,m:'cart',cw:130,ch:100,cc:'#8E8B86'},
GB:{bg:'#CFC8B9',fg:'#221E18',tag:'#ADA592',h:160,m:'cart',cw:88,ch:100,cc:'#B5B1A8'}};
const D=[['s1','GC','스타폭스 어드벤처','v1.2f'],['s1','GC','스타폭스 어설트','v1.2f'],['s1','GC','이터널 다크니스','v0.1.3'],['s1','GC','기프트피아','v0.1.2'],['s1','GC','돌격 패미컴 워즈','v0.1'],
['s1','Wii','죄와 벌 2','v1.0.2'],['s1','Wii','디재스터','v0.1'],['s1','Wii','돌격 패미컴 워즈 VS','v0.1'],['s1','Wii','어나더 코드 R','작업 중'],['s1','Wii U','도쿄 미라주 세션 #FE','v0.1'],
['s2','3DS','에버오아시스','v0.4'],['s2','3DS','페데레이션 포스','v0.3'],['s2','3DS','파이어 엠블렘 무쌍','v0.2'],['s2','3DS','파르테나의 거울','작업 중'],['s2','NDS','스타폭스 커맨드','v1.2'],['s2','SFC','스타폭스 2','v1.2f'],['s2','GB','키드 이카루스','작업 중']];
const spines=[];
D.forEach(([sid,pf,t,v])=>{const p=P[pf],e=document.createElement('div');e.className='sp';e.dataset.pf=pf;
e.style.cssText=`background:${p.bg};color:${p.fg};height:${p.h}px`;e.innerHTML=`<b style="background:${p.tag};color:${p.fg}">${pf}</b><span>${t}</span>`;
e.onclick=()=>open(pf,t,v);document.getElementById(sid).appendChild(e);spines.push(e);});
[['GC','스타폭스 어설트','v1.2f','10.03'],['GC','이터널 다크니스','v0.1.3','10.02'],['GC','스타폭스 어드벤처','v1.2f','10.02']].forEach(([pf,t,v,dt])=>{const p=P[pf],e=document.createElement('div');e.className='face';
e.style.cssText=`background:${p.bg};color:${p.fg}`;e.innerHTML=`<div style="font-size:10px;opacity:.75">${pf} · ${v}</div><div style="font-size:15px;font-weight:500;line-height:1.3">${t}</div><div style="font-size:10px;opacity:.75">${dt} 갱신</div>`;
e.onclick=()=>open(pf,t,v);document.getElementById('faces').appendChild(e);});
const cw=document.getElementById('chips');['전체','GC','Wii','Wii U','3DS','NDS','SFC','GB'].forEach((k,i)=>{const b=document.createElement('button');b.className='chip'+(i?'':' on');b.textContent=k;
b.onclick=()=>{cw.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');spines.forEach(s=>s.classList.toggle('dim',k!=='전체'&&s.dataset.pf!==k));};cw.appendChild(b);});
const ov=document.getElementById('ov'),fc=document.getElementById('fc'),bk=document.getElementById('bk'),tray=document.getElementById('tray');
function open(pf,t,v){const p=P[pf],done=v!=='작업 중';
fc.style.cssText=`background:${p.bg};color:${p.fg};padding:18px;display:flex;flex-direction:column;justify-content:space-between;border:0.5px solid rgba(0,0,0,.3)`;
fc.innerHTML=`<div style="font-size:11px;opacity:.7">${pf}</div><div style="font-size:22px;font-weight:500;line-height:1.3">${t}</div><div style="font-size:11px;opacity:.7">arqhive 한글판</div>`;
bk.innerHTML=`<div style="font-size:11px;color:#7A6A55">속지 · ${pf}</div><div style="font-size:19px;font-weight:500;margin:6px 0 10px;line-height:1.3">${t}</div>`+
(done?`<div style="font-size:12px;line-height:1.9;color:#4A3F33;border-top:0.5px dashed #CDBFAA;padding-top:8px">최신판 ${v}<br>원본 일본판 필요<br>실기 · 에뮬레이터 확인</div><button style="margin-top:14px;background:#2A241D;color:#EFE9DF;border-color:#2A241D">패치 보기 →</button>`
:`<div style="font-size:12px;line-height:1.8;color:#4A3F33;border-top:0.5px dashed #CDBFAA;padding-top:8px">작업 중인 패치입니다.<br>완성되면 이 속지에<br>다운로드가 열립니다.</div>`);
tray.innerHTML=p.m==='disc'?`<div class="disc" style="width:${p.d}px;height:${p.d}px;background:${p.dc};border:0.5px solid #888"><div style="width:${Math.round(p.d*0.6)}px;height:${Math.round(p.d*0.6)}px;border-radius:50%;background:#F7F5F0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#3A3A3A;text-align:center;line-height:1.3;padding:4px;box-sizing:border-box">${t}</div></div>`
:`<div style="width:${p.cw}px;height:${p.ch}px;background:${p.cc};border-radius:4px 4px 2px 2px;padding:6px;box-sizing:border-box"><div style="background:#F7F5F0;height:62%;border-radius:2px;font-size:10px;color:#3A3A3A;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;padding:2px">${t}</div></div>`;
ov.classList.remove('open');ov.classList.add('show');setTimeout(()=>ov.classList.add('open'),80);}
document.getElementById('close').onclick=()=>{ov.classList.remove('open');setTimeout(()=>ov.classList.remove('show'),500);};
</script>
</body>
</html>
